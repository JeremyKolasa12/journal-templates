name: csl-index

# Rebuild the CSL style index from upstream.
#
# The index is derived data: it is generated here, never hand-edited, and the app
# fetches it from a DATED TAG rather than from the branch. Not for caching —
# jsDelivr serves a tag and a branch identical headers (max-age=604800). For
# correctness: the bytes behind a tag never change, so a stale copy is still a
# correct one, and a new catalogue is a new URL that only a reviewed code change
# adopts. A branch URL would silently hand different readers different
# catalogues. See the README's "Consuming it".
on:
  schedule:
    # Mondays, 05:00 UTC. Upstream adds a few dozen journals a week.
    - cron: '0 5 * * 1'
  workflow_dispatch:
  # Also validate on any PR that touches the index or its scripts, so a
  # hand-edited row is caught before it is merged.
  pull_request:
    paths:
      - 'csl/**'
      - '.github/workflows/csl-index.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The count floor in validate-style-index.mjs compares against
          # HEAD:csl/styles-index.json, so the checkout needs that blob.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # FIRST, validate what is actually committed. The build step below
      # overwrites the file, so checking only afterwards would validate the
      # runner's fresh build and wave through a hand-edited row in the PR.
      - name: Validate the committed index
        run: node csl/validate-style-index.mjs

      - name: Clone the CSL styles repo
        run: git clone --depth 1 https://github.com/citation-style-language/styles.git /tmp/csl-styles

      - name: Rebuild the index
        run: node csl/build-style-index.mjs --styles /tmp/csl-styles

      # And validate the rebuild, which is what would be committed below. On a
      # PR this is the proof that the script still works against current
      # upstream; a diff against the committed file is EXPECTED here, because
      # upstream moves between rebuilds.
      - name: Validate the rebuild
        run: node csl/validate-style-index.mjs

      # A PR only checks that what it proposes is well-formed. Nothing below
      # this line runs for one.
      - name: Commit and tag
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          count=$(node -e 'console.log(require("./csl/styles-index.json").count)')
          generated=$(node -e 'console.log(require("./csl/styles-index.json").generated)')

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Committing and PUBLISHING are separate questions, and conflating them
          # is how the first tag never got created. This step used to bail out
          # whenever the rebuild matched what was already committed — which is the
          # normal state of a fresh repo whose index was committed by hand — so
          # there was nothing to commit, and therefore nothing was ever tagged,
          # and the app's pinned URL 404'd forever. The tag had to be cut by hand
          # to get this off the ground at all.
          if git diff --quiet csl/styles-index.json; then
            echo "index unchanged — nothing to commit"
          else
            git add csl/styles-index.json
            git commit -m "chore(csl): rebuild style index (${count} styles)"
            git push
          fi

          # Now reconcile the tag against what is in the tree, whether or not this
          # run changed it. The question is "are these bytes published?", not
          # "did I just change them?".
          git fetch --tags --force --quiet

          # Compared as git BLOB IDS, not as bytes: a Windows checkout stores
          # CRLF in the working tree while the blob is LF, so `cmp` against the
          # file on disk reports a difference that does not exist. `hash-object`
          # normalises the same way `add` does.
          want=$(git hash-object csl/styles-index.json)

          base="csl-${generated}"
          tag="$base"
          n=1
          # A tag promises the bytes behind it never change, so an existing one is
          # never moved. If it already holds exactly this index, publishing is
          # done; if it holds something else (upstream committed twice in a day),
          # the new content gets its own suffix.
          while git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; do
            if [ "$(git rev-parse "${tag}:csl/styles-index.json")" = "$want" ]; then
              echo "already published as ${tag}"
              {
                echo "### csl-index"
                echo "No change: \`${tag}\` already holds these ${count} styles."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            n=$((n + 1))
            tag="${base}.${n}"
          done

          git tag "$tag"
          git push origin "$tag"
          echo "tagged ${tag} (${count} styles)"
          echo "### csl-index" >> "$GITHUB_STEP_SUMMARY"
          echo "Tagged \`${tag}\` with ${count} styles." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${tag}/csl/styles-index.json\`" >> "$GITHUB_STEP_SUMMARY"
