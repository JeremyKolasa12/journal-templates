name: validate
on:
  push:
    # The repo's default branch is `master`. This said `main`, so the push job
    # (and the index-regeneration step below it) had never once run.
    branches: [master]
  pull_request:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Regenerate the index from templates/*.json, then validate everything.
      - run: node generate-index.mjs
      - run: node validate.mjs
      # On the default branch, commit the regenerated index if a contribution
      # changed it.
      - name: Commit updated index
        if: github.ref == 'refs/heads/master'
        run: |
          if ! git diff --quiet index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "chore: regenerate index.json"
            git push
          fi
